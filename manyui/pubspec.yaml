name: manyui
description: Flutter UI components for web, mobile, and desktop, with few dependencies. Works without MaterialApp.
version: 0.1.1
homepage: https://github.com/ManyMath/ManyUI
repository: https://github.com/ManyMath/ManyUI
issue_tracker: https://github.com/ManyMath/ManyUI/issues

environment:
  flutter: ">=3.38.0"
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  manyui_testing: any

flutter:
  uses-material-design: false
